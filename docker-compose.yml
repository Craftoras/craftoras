services:
  mongodb:
    image: mongo:7-jammy
    container_name: craftoras-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - craftoras-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: craftoras-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DB_URL=mongodb://mongodb:27017/ec
      - SECRET=${SECRET:-craftoras_dev_jwt_secret}
      - CLIENT_URL=${CLIENT_URL:-http://localhost:3000}
    depends_on:
      - mongodb
    networks:
      - craftoras-network

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: craftoras-dashboard
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      - backend
    networks:
      - craftoras-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: craftoras-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - craftoras-network

networks:
  craftoras-network:
    driver: bridge

volumes:
  mongodb_data:
